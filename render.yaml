# Render blueprint (free web service). Each deploy rebuilds the demo database with 100+ records per table.
services:
  - type: web
    name: renofolio
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/generate_test_data.py
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT run:app
    autoDeploy: false   # deployments are triggered by the GitHub Actions pipeline after tests pass
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
